<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生き物じゃんけん ARCADE ONLINE</title><style>*{box-sizing:border-box}body{margin:0;background:#080e22;color:#f4f6ff;font:15px system-ui,sans-serif}.wrap{max-width:750px;margin:auto;padding:18px}.hero{text-align:center;padding:20px 0}.hero h1{color:#ffd45d;text-shadow:0 0 20px #ffbc4b66;margin:8px 0}.box{background:#172143;border:1px solid #455586;border-radius:15px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.three{grid-template-columns:repeat(3,1fr)}button,input,select{font:inherit;border-radius:10px;padding:12px;border:1px solid #6675a8}button{background:#344573;color:white;font-weight:bold;cursor:pointer}button:disabled{opacity:.35}.gold{background:linear-gradient(90deg,#d59520,#ffdc6c);color:#201500}.purple{background:#6548b7}input,select{background:#0e1731;color:white;width:100%}.hidden{display:none!important}.muted{color:#b2bfdc;font-size:13px}.big{font-size:44px}.bar{height:12px;background:#384366;border-radius:8px;overflow:hidden}.bar>div{height:100%;background:#39d88b}.bar.red>div{background:#f56b80}.log{max-height:250px;overflow:auto;font-size:13px;line-height:1.8}.log div{border-bottom:1px solid #33416b;padding:4px}.card{text-align:center}.card b{display:block}#notice{color:#ffda75;font-weight:800;text-align:center;padding:10px}.badge{display:inline-block;border:1px solid #6372a7;border-radius:30px;padding:5px 10px;font-size:12px}#cards button{min-height:92px}.moves button{min-height:108px}.moves span{display:block;font-size:26px}.moves small{display:block;color:#ffe48b}.footer{font-size:12px;color:#9aaac9;text-align:center;margin:20px 0}</style></head><body><div class="wrap"><header class="hero"><div class="muted">ANIMAL RPS BATTLE</div><h1>⚡ 生き物じゃんけん ⚡</h1><div class="badge">ARCADE × ONLINE</div></header><div id="menu" class="box"><h2>🎮 ゲームモード</h2><div class="grid"><button class="gold" onclick="show('select')">🏆 アーケード<br><small>CPU 5連戦</small></button><button class="purple" onclick="show('online')">🌐 ルームマッチ<br><small>友達と対戦</small></button></div><p class="muted">10種類の生き物から選択。オンライン対戦は2人同時参加が必要です。</p></div><div id="select" class="hidden"><h2>🃏 キャラクター選択</h2><div id="cards" class="grid"></div><div class="box" id="description"></div><button class="gold" style="width:100%" onclick="startArcade()">▶ アーケードに出撃</button><button onclick="show('menu')">戻る</button></div><div id="online" class="hidden"><div class="box"><h2>🌐 オンラインルーム</h2><label>プレイヤー名<input id="playerName" maxlength="20" value="PLAYER"></label><p>使用するカード</p><select id="onlineCard"></select><div class="grid" style="margin-top:12px"><button class="gold" onclick="createRoom()">ルームを作成</button><button onclick="joinRoom()">番号で参加</button></div><p><input id="roomInput" inputmode="numeric" maxlength="6" placeholder="6桁のルーム番号"></p><p id="onlineError" class="muted"></p></div><button onclick="show('menu')">戻る</button></div><div id="match" class="hidden"><div class="box"><h2>🔗 ルーム <span id="roomCode"></span></h2><button onclick="copyRoom()">招待リンクをコピー</button><p id="roomStatus" class="muted"></p></div><div id="matchBattle" class="hidden"><div class="grid"><div class="box card"><div id="mpic" class="big"></div><b id="mname"></b><div id="mhp"></div><div class="bar"><div id="mbar"></div></div></div><div class="box card"><div id="opic" class="big"></div><b id="oname"></b><div id="ohp"></div><div class="bar red"><div id="obar"></div></div></div></div><div id="matchNotice" class="box"></div><div id="matchMoves" class="grid three moves"></div><div class="box log" id="matchLog"></div></div><button onclick="leaveRoom()">ルームを退出</button></div><div id="arcade" class="hidden"><div class="box"><div id="stage" style="text-align:center;color:#ffdc6a;font-weight:bold"></div><div class="grid"><div class="card"><div id="apic" class="big"></div><b id="aname"></b><div id="ahp"></div><div class="bar"><div id="abar"></div></div></div><div class="card"><div id="epic" class="big"></div><b id="ename"></b><div id="ehp"></div><div class="bar red"><div id="ebar"></div></div></div></div></div><div id="notice" class="box"></div><div id="arcMoves" class="grid three moves"></div><div class="box log" id="arcLog"></div><div id="nextPanel" class="box hidden"><h2 id="nextTitle"></h2><p id="nextDesc"></p><button class="gold" id="nextButton">次へ</button></div><button onclick="show('menu')">タイトルに戻る</button></div><p class="footer">試作版：ルームはサーバー再起動で消えます。対戦ルールは今後さらに完全実装・調整予定。</p></div><script>
const names=['カブトムシ','パラポネラ','クロオオアリ','オオカマキリ','ネコ','ライオン（オス）','マウンテンゴリラ','ワシ','イリエワニ','ヒクイドリ'];const icons=['🪲','🐜','🐜','🦗','🐈','🦁','🦍','🦅','🐊','🐦'];const hp=[180,150,160,200,250,300,280,180,300,160];const moves=[['頭突き','角払い','トルネードスロー'],['ヴェノムエンド','毒針','ポイズンヒール'],['パワーバイト','アゴばさみ','アントガード'],['プレデタークロー','マンティスブレード','ハンティングステップ'],['キャットインパクト','ネコひっかき','甘える'],['プライドクラッシュ','キングスクラッチ','キングズロア'],['ゴライアスパンチ','ジャングルキング','貪る'],['イーグルクロー','ゴッドバード','スカイハント'],['クロコダイルテール','引き裂く爪','デビルバイト'],['遠吠え','ディノ・ラプトル・レイド','ラストダンス']];const dmg=[[40,70,100],[0,20,0],[120,50,0],[50,0,60],[100,80,0],[140,50,30],[200,60,0],[70,200,30],[60,40,50],[20,100,20]];const special=[2,0,0,1,0,2,0,2,2,1],hand=['✊','✌️','✋'];const $=id=>document.getElementById(id);let chosen=0,arc=null,session=null,poll=null,lastRound=0;
function show(id){for(const s of ['menu','select','online','match','arcade'])$(s).classList.toggle('hidden',s!==id);if(id!=='match'&&poll){clearInterval(poll);poll=null;}}
function setupCards(){names.forEach((n,i)=>{let b=document.createElement('button');b.innerHTML=icons[i]+'<br>'+n+'<br>HP '+hp[i];b.onclick=()=>{chosen=i;setupCardsSelection();};$('cards').append(b);$('onlineCard').add(new Option(icons[i]+' '+n,i));});setupCardsSelection();}
function setupCardsSelection(){[...$('cards').children].forEach((b,i)=>b.style.borderColor=i===chosen?'#ffdf62':'#6675a8');$('description').textContent=names[chosen]+'：'+moves[chosen].map((x,i)=>hand[i]+x+' '+dmg[chosen][i]+'ダメージ'+(i===special[chosen]?' ★必殺':'')).join(' / ');}
function api(url,data){return fetch('/api/'+url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(async r=>{const x=await r.json();if(!r.ok)throw Error(x.error);return x;});}
async function createRoom(){try{const d=await api('create',{name:$('playerName').value,card:+$('onlineCard').value});enterRoom(d);}catch(e){$('onlineError').textContent=e.message;}}
async function joinRoom(){try{const d=await api('join',{name:$('playerName').value,card:+$('onlineCard').value,code:$('roomInput').value});enterRoom(d);}catch(e){$('onlineError').textContent=e.message;}}
function enterRoom(d){session=d;lastRound=0;$('roomCode').textContent=d.code;show('match');refresh();poll=setInterval(refresh,1300);}
function leaveRoom(){session=null;show('menu');}
function copyRoom(){const link=location.origin+'/?room='+session.code;if(navigator.clipboard)navigator.clipboard.writeText(link).then(()=>$('roomStatus').textContent='招待リンクをコピーしました').catch(()=>$('roomStatus').textContent=link);else $('roomStatus').textContent=link;}
async function refresh(){if(!session)return;try{const r=await fetch('/api/room?code='+encodeURIComponent(session.code)+'&token='+encodeURIComponent(session.token),{cache:'no-store'});if(!r.ok)throw Error('ルームに接続できません');const d=await r.json();if(!session)return;$('roomStatus').textContent=d.phase==='waiting'?'友達の参加を待っています…':d.phase==='playing'?'対戦中 · TURN '+d.round:'対戦終了';$('matchBattle').classList.toggle('hidden',d.phase==='waiting');if(d.phase==='waiting')return;const me=d.players[d.you],op=d.players[1-d.you];for(const [p,prefix] of [[me,'m'],[op,'o']]){$(prefix+'pic').textContent=icons[p.card];$(prefix+'name').textContent=p.name+' · '+names[p.card];$(prefix+'hp').textContent='HP '+p.hp+'/'+hp[p.card];$(prefix+'bar').style.width=100*p.hp/hp[p.card]+'%';}const myLast=d.history.length?d.history[d.history.length-1]:null;$('matchLog').innerHTML=d.history.slice().reverse().map(h=>'<div>TURN '+h.round+' '+hand[h.hands[d.you]]+' VS '+hand[h.hands[1-d.you]]+' — '+h.notes.join(' / ')+'</div>').join('');$('matchMoves').innerHTML='';if(d.phase==='finished'){$('matchNotice').textContent=d.winner==='draw'?'引き分け！':d.winner===d.you?'🏆 あなたの勝利！':'💀 相手の勝利！';return;}$('matchNotice').textContent=me.ready?'相手の手を待っています…':'手を選んでください（相手には公開されません）';moves[me.card].forEach((m,i)=>{let b=document.createElement('button');b.disabled=me.ready;b.innerHTML='<span>'+hand[i]+'</span>'+m+'<small>'+dmg[me.card][i]+' DMG'+(i===special[me.card]?' ★':'')+'</small>';b.onclick=()=>api('move',{...session,hand:i}).then(refresh).catch(e=>alert(e.message));$('matchMoves').append(b);});}catch(e){$('roomStatus').textContent=e.message;}}
function win(a,b){return a===b?0:((a===0&&b===1)||(a===1&&b===2)||(a===2&&b===0)?1:-1);}
function startArcade(){const pool=names.map((_,i)=>i).filter(i=>i!==chosen).sort(()=>Math.random()-.5);arc={player:chosen,health:hp[chosen],stage:1,pool:pool.slice(0,5),turn:1,streak:0,enemyStreak:0,poison:0,enemyPoison:0,howl:0};show('arcade');startStage();}
function startStage(){arc.enemy=arc.pool[arc.stage-1];arc.enemyHealth=hp[arc.enemy];arc.turn=1;arc.streak=0;arc.enemyStreak=0;arc.poison=arc.enemyPoison=0;arc.howl=0;if(arc.player===1)arc.enemyPoison=5;if(arc.enemy===1)arc.poison=5;$('arcLog').innerHTML='';$('nextPanel').classList.add('hidden');arcRender();}
function arcLog(t){const x=document.createElement('div');x.textContent=t;$('arcLog').prepend(x);}
function arcRender(){const a=arc,b=arc.enemy;$('stage').textContent='STAGE '+a.stage+'/5 · TURN '+a.turn;$('apic').textContent=icons[a.player];$('epic').textContent=icons[b];$('aname').textContent=names[a.player];$('ename').textContent=names[b];$('ahp').textContent=a.health+'/'+hp[a.player];$('ehp').textContent=a.enemyHealth+'/'+hp[b];$('abar').style.width=100*a.health/hp[a.player]+'%';$('ebar').style.width=100*a.enemyHealth/hp[b]+'%';$('notice').textContent='技を選択！';$('arcMoves').innerHTML='';moves[a.player].forEach((m,i)=>{const btn=document.createElement('button');btn.innerHTML='<span>'+hand[i]+'</span>'+m+'<small>'+dmg[a.player][i]+' DMG'+(i===special[a.player]?' ★':'')+'</small>';btn.onclick=()=>arcPlay(i);$('arcMoves').append(btn);});}
function arcPlay(ph){const a=arc,eh=Math.floor(Math.random()*3),r=win(ph,eh);arcLog('TURN '+a.turn+' '+hand[ph]+' VS '+hand[eh]);if(r===0){a.health-=10;a.enemyHealth-=10;a.streak=a.enemyStreak=0;arcLog('あいこ！ 両者10ダメージ');}else{const player=r===1,att=player?a.player:a.enemy,handIndex=player?ph:eh;let n=dmg[att][handIndex];if(att===9)n+=Math.floor(((hp[att]-(player?a.health:a.enemyHealth))/40))*20;if(att===8&&(player?a.streak:a.enemyStreak)===1)n*=2;if(att===8&&handIndex===2&&(player?a.streak:a.enemyStreak)===1)n=300;if(att===9&&handIndex===1&&Math.random()<.5)n+=50;if(att===3&&handIndex===1)n=Math.ceil((player?a.enemyHealth:a.health)/2);if(att===1&&handIndex===0&&(player?a.enemyPoison:a.poison)>0)n=player?a.enemyHealth:a.health;if(att===9&&handIndex===0&&player)a.howl+=30;if(att===9&&handIndex===1&&player){n+=a.howl;a.howl=0;}if(player){a.enemyHealth-=n;a.streak++;a.enemyStreak=0;}else{a.health-=n;a.enemyStreak++;a.streak=0;}if(att===5&&handIndex===0){if(player)a.health-=50;else a.enemyHealth-=50;}if(att===7&&handIndex===1){if(player)a.health=Math.min(10,a.health);else a.enemyHealth=Math.min(10,a.enemyHealth);}if(att===4&&handIndex===0){if(player)a.health=Math.min(hp[att],a.health+30);else a.enemyHealth=Math.min(hp[att],a.enemyHealth+30);}if(att===1&&handIndex===1){if(player)a.enemyPoison+=3;else a.poison+=3;}arcLog((player?'YOU':'CPU')+' '+moves[att][handIndex]+'：'+n+'ダメージ');}if(a.poison>0&&a.health>0){a.health-=20;a.poison--;}if(a.enemyPoison>0&&a.enemyHealth>0){a.enemyHealth-=20;a.enemyPoison--;}if(a.player===4&&a.health>0)a.health=Math.min(hp[4],a.health+20);if(a.enemy===4&&a.enemyHealth>0)a.enemyHealth=Math.min(hp[4],a.enemyHealth+20);a.health=Math.max(0,a.health);a.enemyHealth=Math.max(0,a.enemyHealth);a.turn++;arcRender();if(a.health===0||a.enemyHealth===0){$('arcMoves').innerHTML='';$('nextPanel').classList.remove('hidden');if(a.health>0){$('nextTitle').textContent=a.stage===5?'🏆 ALL CLEAR！':'✨ STAGE CLEAR！';if(a.stage===5){$('nextDesc').textContent='5連勝達成！';$('nextButton').textContent='もう一度挑戦';$('nextButton').onclick=startArcade;}else{const old=a.health;a.health=Math.min(hp[a.player],a.health+Math.ceil(hp[a.player]*.3));$('nextDesc').textContent='HP '+old+' → '+a.health+'（30%回復）';$('nextButton').textContent='次のステージへ';$('nextButton').onclick=()=>{a.stage++;startStage();};}}else{$('nextTitle').textContent='💀 GAME OVER';$('nextDesc').textContent='ステージ'+a.stage+'で敗北！';$('nextButton').textContent='最初から再挑戦';$('nextButton').onclick=startArcade;}}}
setupCards();const code=new URLSearchParams(location.search).get('room');if(code&&/^\d{6}$/.test(code)){$('roomInput').value=code;show('online');}
</script></body></html>
