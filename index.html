<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生き物じゃんけん ARCADE ONLINE</title><style>*{box-sizing:border-box}body{margin:0;background:#080e22;color:#f4f6ff;font:15px system-ui,sans-serif}.wrap{max-width:750px;margin:auto;padding:18px}.hero{text-align:center;padding:20px 0}.hero h1{color:#ffd45d;text-shadow:0 0 20px #ffbc4b66;margin:8px 0}.box{background:#172143;border:1px solid #455586;border-radius:15px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}button,input,select{font:inherit;border-radius:10px;padding:12px;border:1px solid #6675a8}button{background:#344573;color:white;font-weight:bold;cursor:pointer}button:disabled{opacity:.35}.gold{background:linear-gradient(90deg,#d59520,#ffdc6c);color:#201500}.purple{background:#6548b7}input,select{background:#0e1731;color:white;width:100%}.hidden{display:none!important}.muted{color:#b2bfdc;font-size:13px}.big{font-size:44px}.bar{height:12px;background:#384366;border-radius:8px;overflow:hidden}.bar>div{height:100%;background:#39d88b}.bar.red>div{background:#f56b80}.log{max-height:250px;overflow:auto;font-size:13px;line-height:1.8}.log div{border-bottom:1px solid #33416b;padding:4px}.card{text-align:center}.card b{display:block}#notice{color:#ffda75;font-weight:800;text-align:center;padding:10px}.badge{display:inline-block;border:1px solid #6372a7;border-radius:30px;padding:5px 10px;font-size:12px}#cards button{min-height:92px}.moves button{min-height:130px;padding:8px 4px;font-size:12px;overflow-wrap:anywhere}.moves span{display:block;font-size:26px}.moves small{display:block;color:#ffe48b}.moves em{display:block;font-size:11px;font-style:normal;color:#c7d6fa;margin-top:6px;line-height:1.45}.status{color:#ffe48b;font-size:12px;margin-top:6px}.footer{font-size:12px;color:#9aaac9;text-align:center;margin:20px 0}#debug .moves button{min-height:64px;width:100%;padding:8px;margin-top:5px;font-size:12px}#debug .moves button.selected{border-color:#ffdc6a;background:#5b4c80}#debug label{font-size:12px}#debug input{padding:7px}
/* RPS hand colors and special-move emphasis (visual only) */
.hand-rock{--hand-accent:#f36a76;--hand-bg:#572b45;--hand-edge:#e86c78}
.hand-scissors{--hand-accent:#80bbff;--hand-bg:#263f72;--hand-edge:#639ff0}
.hand-paper{--hand-accent:#8ee5a9;--hand-bg:#245443;--hand-edge:#56c98a}
.moves button.rps-move{background:linear-gradient(155deg,var(--hand-bg),#1a2544 92%);border:2px solid var(--hand-edge);color:#fff;position:relative;transition:filter .15s,transform .15s}
.moves button.rps-move>span{color:var(--hand-accent);text-shadow:0 1px 12px #0008}
.moves button.rps-move:enabled:active{transform:scale(.97)}
.moves button.rps-move:disabled{opacity:.4;filter:grayscale(.5)}
.moves button.rps-move.is-special{border:3px solid #ffdb68;background:linear-gradient(145deg,#675020,#302647 65%,var(--hand-bg));box-shadow:inset 0 0 0 1px #ffe6a45e,0 0 13px #ffc64250}
.moves button.rps-move.is-special>span{color:#ffdf7b}
.special-tag{display:block;width:fit-content;max-width:100%;margin:5px auto;padding:3px 8px;border:1px solid #ffdb68;border-radius:30px;background:#5a3b13;color:#ffecab;font-size:11px;font-weight:900;letter-spacing:.04em}
#debug .moves button.rps-move{min-height:78px;padding:8px 5px}
#debug .moves button.rps-move.selected{outline:3px solid #fff0b3;outline-offset:1px;box-shadow:0 0 0 2px #e0b84a,0 0 14px #f9d26b6b}
#description .move-detail{padding:9px 10px;border-left:4px solid var(--hand-edge);background:linear-gradient(90deg,var(--hand-bg),transparent);border-radius:8px;line-height:1.6}
#description .move-detail.is-special{border:2px solid #f4c85a;border-left:5px solid #ffe08a;background:linear-gradient(100deg,#59431d,#262643);box-shadow:0 0 12px #f5c55e35}
#description .move-detail .special-inline{color:#ffe18a;font-weight:900;margin-left:5px}

/* v8.2: キャラクター紹介の技をじゃんけん別に色分け */
#description .intro-move{margin:10px 0;padding:12px 13px;border:2px solid;border-radius:12px;line-height:1.55}
#description .intro-move.hand-rock{background:#49283c;border-color:#e86c78}
#description .intro-move.hand-scissors{background:#213962;border-color:#639ff0}
#description .intro-move.hand-paper{background:#214b3c;border-color:#56c98a}
#description .intro-move-title{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-bottom:6px}
#description .intro-move.hand-rock .intro-move-title{color:#ffacb4}
#description .intro-move.hand-scissors .intro-move-title{color:#b3d7ff}
#description .intro-move.hand-paper .intro-move-title{color:#a5f2bd}
#description .intro-move-detail{color:#eef1ff;font-size:13px}
#description .intro-move.is-special{border-color:#ffdc6a;box-shadow:0 0 0 1px #ffe69b55,0 0 14px #ffce5850}
#description .intro-special-tag{display:inline-block;padding:2px 9px;border:1px solid #ffdf85;border-radius:30px;background:#5e411a;color:#ffe49a;font-size:12px;font-weight:800}

/* beetle animation preview: CSS-only transforms, no gameplay changes */
.battle-arena{position:relative;height:170px;overflow:hidden;margin:12px 0;border:2px solid #60738d;border-radius:12px;background:linear-gradient(#1e4263 0 65%,#406146 65% 73%,#6b6545 73%);image-rendering:pixelated}
.battle-arena:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 28px,#ffffff08 28px 30px);pointer-events:none}
.battle-slot{position:absolute;bottom:17px;width:44%;height:110px;display:flex;align-items:end;justify-content:center;transform-origin:bottom center}
.battle-slot.left{left:3%;--attack-dir:1}.battle-slot.right{right:3%;--attack-dir:-1}
.battle-sprite{width:min(100%,205px);height:100px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(2px 5px 1px #0008);animation:beetle-idle 1.5s steps(3) infinite}
.battle-slot.right .battle-sprite{transform:scaleX(-1)}
.battle-emoji{font-size:70px;line-height:110px;filter:drop-shadow(3px 6px 2px #0006);animation:beetle-idle 1.5s steps(3) infinite}
/* Beetle idle v2: four real pixel frames. Missing new asset falls back to old PNG. */
.beetle-idle{aspect-ratio:210 / 86;height:auto;min-height:0;background:url('/assets/beetle.png') center / contain no-repeat;animation:none;will-change:background-position}
.beetle-idle.idle-ready{background-image:url('/assets/beetle-idle.png?v=idle-v2');background-size:400% 100%;background-repeat:no-repeat;background-position:0% center;animation:beetle-idle-frames 1.4s steps(1,end) infinite}
@keyframes beetle-idle-frames{
 0%,24.99%{background-position:0% center}
 25%,49.99%{background-position:33.333333% center}
 50%,74.99%{background-position:66.666667% center}
 75%,100%{background-position:100% center}
}
.battle-slot:is(.attack-rock,.attack-scissors,.attack-paper,.hurt,.victory,.tornado-thrown-v23) .beetle-idle{animation-play-state:paused}

.battle-slot.right .battle-emoji{transform:scaleX(-1)}
.battle-floor{position:absolute;bottom:10px;width:34%;height:9px;border-radius:50%;background:#101a1888}.battle-floor.left{left:8%}.battle-floor.right{right:8%}
.battle-move-name{position:absolute;left:10px;right:10px;top:8px;text-align:center;font-weight:900;color:#ffe28e;text-shadow:1px 2px #000;pointer-events:none}
.battle-slot.attack-rock{animation:beetle-headbutt-v21 .65s linear both}.battle-slot.attack-scissors{animation:beetle-swipe .8s ease-in-out}.battle-slot.attack-paper{animation:beetle-tornado 1.15s ease-in-out}.battle-slot.hurt{animation:beetle-hurt .5s ease-in-out}.battle-slot.victory{animation:beetle-victory 1.2s ease-in-out}
@keyframes beetle-idle{0%,100%{translate:0 0}50%{translate:0 -4px}}
@keyframes beetle-headbutt{0%,100%{translate:0 0;rotate:0}20%{translate:calc(-12px * var(--attack-dir)) 3px;rotate:-8deg}55%{translate:calc(88px * var(--attack-dir)) -4px;rotate:9deg}75%{translate:calc(44px * var(--attack-dir)) 0}}
@keyframes beetle-swipe{0%,100%{translate:0 0;rotate:0}24%{translate:calc(-10px * var(--attack-dir)) 4px;rotate:-22deg}52%{translate:calc(45px * var(--attack-dir)) -20px;rotate:28deg}72%{translate:calc(26px * var(--attack-dir)) -7px;rotate:-8deg}}
@keyframes beetle-tornado{0%,100%{translate:0 0;rotate:0;scale:1}22%{translate:calc(20px * var(--attack-dir)) -12px;rotate:-28deg;scale:1.06}48%{translate:calc(67px * var(--attack-dir)) -30px;rotate:60deg;scale:1.12}70%{translate:calc(42px * var(--attack-dir)) -18px;rotate:360deg;scale:1.08}85%{translate:calc(14px * var(--attack-dir)) -3px;rotate:390deg}}
@keyframes beetle-hurt{0%,100%{opacity:1;translate:0 0}30%{opacity:.15;translate:calc(24px * var(--attack-dir)) 0}65%{opacity:1;translate:calc(12px * var(--attack-dir)) 0}}
@keyframes beetle-victory{0%,100%{translate:0 0;rotate:0}35%{translate:0 -13px;rotate:-8deg}65%{translate:0 -8px;rotate:8deg}}
.damage-float{position:absolute;bottom:95px;left:13%;z-index:8;font-size:22px;font-weight:1000;color:#ff657b;text-shadow:2px 2px #162033,-1px -1px #162033;pointer-events:none;white-space:nowrap;animation:damage-rise 1.7s ease-out both}
.damage-float.right{left:auto;right:13%}
.damage-float.heal{color:#76ffc3}
@keyframes damage-rise{0%{opacity:0;translate:0 16px;scale:.7}18%{opacity:1;scale:1.15}74%{opacity:1;translate:0 -18px}100%{opacity:0;translate:0 -45px}}

/* Beetle Headbutt 2.1: visual-only upgrade; damage/turn logic unchanged. */
/* Wind-up 0-120ms, explosive rush 120-290ms, collision, recoil and return. */
@keyframes beetle-headbutt-v21{
  0%   {translate:0 0;rotate:0deg;scale:1}
  12%  {translate:calc(-10px * var(--attack-dir)) 2px;rotate:-4deg;scale:1 .97}
  19%  {translate:calc(-20px * var(--attack-dir)) 4px;rotate:-9deg;scale:1 .94}
  34%  {translate:calc(37px * var(--attack-dir)) -3px;rotate:4deg;scale:1.06 1.03}
  46%  {translate:calc(96px * var(--attack-dir)) -7px;rotate:9deg;scale:1.08 1.04}
  58%  {translate:calc(83px * var(--attack-dir)) -5px;rotate:7deg;scale:1.05 1}
  78%  {translate:calc(24px * var(--attack-dir)) 0px;rotate:-2deg;scale:1.01 1}
  92%  {translate:calc(-4px * var(--attack-dir)) 0px;rotate:0deg;scale:1}
  100% {translate:0 0;rotate:0deg;scale:1}
}
/* Tiny pixel burst placed at the defender on impact. */
.battle-slot.headbutt-impact::after{
  content:'✦';position:absolute;z-index:5;left:12%;top:20px;
  color:#ffe7a0;font-size:38px;font-weight:900;line-height:1;
  text-shadow:2px 0 #ff9d45,-2px 0 #ff9d45,0 2px #ff9d45,0 -2px #ff9d45;
  pointer-events:none;animation:beetle-headbutt-spark .32s steps(3,end) both;
}
.battle-slot.headbutt-impact .battle-sprite,.battle-slot.headbutt-impact .battle-emoji{filter:brightness(1.6) drop-shadow(2px 5px 1px #0008)}
@keyframes beetle-headbutt-spark{
  0%{opacity:0;scale:.2;rotate:0deg}
  24%{opacity:1;scale:1.35;rotate:30deg}
  65%{opacity:.85;scale:1;rotate:65deg}
  100%{opacity:0;scale:1.55;rotate:95deg}
}
@media(prefers-reduced-motion:reduce){.battle-slot.headbutt-impact::after{animation:none;opacity:0}}

/* Beetle Horn Swipe v2.2: all visual. The engine still owns damage and turns. */
.battle-slot.attack-scissors{animation:beetle-horn-swipe-v22 .84s cubic-bezier(.18,.72,.24,1) both}
/* A low wind-up followed by a quick upward horn-swing and a firm landing. */
@keyframes beetle-horn-swipe-v22{
  0%   {translate:0 0;rotate:0deg;scale:1}
  15%  {translate:calc(-10px * var(--attack-dir)) 4px;rotate:calc(-5deg * var(--attack-dir));scale:1.03 .94}
  29%  {translate:calc(-17px * var(--attack-dir)) 7px;rotate:calc(-13deg * var(--attack-dir));scale:1.08 .9}
  41%  {translate:calc(15px * var(--attack-dir)) 1px;rotate:calc(10deg * var(--attack-dir));scale:1.07 1.02}
  51%  {translate:calc(52px * var(--attack-dir)) -15px;rotate:calc(25deg * var(--attack-dir));scale:1.09 1.07}
  60%  {translate:calc(47px * var(--attack-dir)) -19px;rotate:calc(19deg * var(--attack-dir));scale:1.07 1.04}
  74%  {translate:calc(18px * var(--attack-dir)) -7px;rotate:calc(-4deg * var(--attack-dir));scale:1.02 1}
  90%  {translate:calc(-3px * var(--attack-dir)) 1px;rotate:0deg;scale:1}
  100% {translate:0 0;rotate:0deg;scale:1}
}
/* Golden pixel-like swoosh travels in front of the horn at peak swing. */
.battle-slot.attack-scissors::after{
  content:'';position:absolute;z-index:6;left:58%;top:9px;width:52px;height:57px;
  pointer-events:none;box-sizing:border-box;
  border-top:7px solid #ffeaa5;border-right:6px solid #ffb947;
  border-radius:85% 100% 25% 0%;
  filter:drop-shadow(2px 1px 0 #e27a2b);
  animation:beetle-horn-trail-v22 .84s steps(1,end) both;
}
.battle-slot.right.attack-scissors::after{left:auto;right:58%;transform:scaleX(-1)}
@keyframes beetle-horn-trail-v22{
  0%,29%{opacity:0;scale:.5;translate:calc(-15px * var(--attack-dir)) 24px}
  35%{opacity:.55;scale:.76;translate:calc(-3px * var(--attack-dir)) 12px}
  42%,51%{opacity:1;scale:1.15;translate:calc(12px * var(--attack-dir)) -6px}
  61%{opacity:.75;scale:1.2;translate:calc(21px * var(--attack-dir)) -18px}
  72%,100%{opacity:0;scale:1.25;translate:calc(26px * var(--attack-dir)) -27px}
}
/* Recipient is launched up, not simply pushed back like a headbutt. */
.battle-slot.hurt.swipe-launch-v22{animation:beetle-swipe-launch-v22 .60s ease-out both}
@keyframes beetle-swipe-launch-v22{
  0%{opacity:1;translate:0 0;rotate:0deg}
  15%{opacity:.62;translate:calc(8px * var(--attack-dir)) -10px;rotate:calc(6deg * var(--attack-dir))}
  32%{opacity:1;translate:calc(17px * var(--attack-dir)) -29px;rotate:calc(12deg * var(--attack-dir))}
  50%{opacity:1;translate:calc(24px * var(--attack-dir)) -33px;rotate:calc(8deg * var(--attack-dir))}
  73%{opacity:.84;translate:calc(28px * var(--attack-dir)) -12px;rotate:calc(-5deg * var(--attack-dir))}
  89%{opacity:1;translate:calc(12px * var(--attack-dir)) 2px;rotate:0deg}
  100%{opacity:1;translate:0 0;rotate:0deg}
}
.battle-slot.swipe-impact-v22::before{
  content:'✦';position:absolute;z-index:7;top:-8px;left:22%;color:#ffeab3;
  font-size:42px;line-height:1;font-weight:900;pointer-events:none;
  text-shadow:3px 0 #ff963f,-3px 0 #ff963f,0 3px #ff963f,0 -3px #ff963f;
  animation:beetle-swipe-spark-v22 .4s steps(3,end) both;
}
@keyframes beetle-swipe-spark-v22{
  0%{opacity:0;scale:.3;rotate:-45deg}
  18%,48%{opacity:1;scale:1.2;rotate:5deg}
  75%{opacity:.7;scale:1.45;rotate:45deg}
  100%{opacity:0;scale:1.7;rotate:80deg}
}
.battle-slot.swipe-impact-v22 .battle-sprite,
.battle-slot.swipe-impact-v22 .battle-emoji{filter:brightness(1.65) drop-shadow(2px 5px 1px #0008)}
@media(prefers-reduced-motion:reduce){
  .battle-slot.attack-scissors::after,.battle-slot.swipe-impact-v22::before{display:none}
}



/* Beetle Tornado Throw v2.3: all effects are presentation, not game logic. */
.battle-slot.attack-paper{animation:beetle-tornado-lift-v23 1.54s cubic-bezier(.23,.69,.3,1) both}
@keyframes beetle-tornado-lift-v23{
  0%{translate:0 0;rotate:0deg;scale:1}
  11%{translate:calc(-11px * var(--attack-dir)) 3px;rotate:calc(-5deg * var(--attack-dir));scale:1.03 .96}
  23%{translate:calc(-19px * var(--attack-dir)) 8px;rotate:calc(-12deg * var(--attack-dir));scale:1.08 .91}
  33%{translate:calc(10px * var(--attack-dir)) 1px;rotate:calc(7deg * var(--attack-dir));scale:1.06 1.02}
  44%{translate:calc(58px * var(--attack-dir)) -16px;rotate:calc(24deg * var(--attack-dir));scale:1.12 1.07}
  57%{translate:calc(49px * var(--attack-dir)) -12px;rotate:calc(19deg * var(--attack-dir));scale:1.1 1.03}
  70%{translate:calc(26px * var(--attack-dir)) -5px;rotate:calc(4deg * var(--attack-dir));scale:1.04 1.02}
  85%{translate:calc(-4px * var(--attack-dir)) 0px;rotate:calc(-3deg * var(--attack-dir));scale:1}
  100%{translate:0 0;rotate:0deg;scale:1}
}
.battle-slot.attack-paper::after{
  content:'✧';z-index:6;position:absolute;right:4%;top:-11px;
  color:#c7ffff;font-size:34px;line-height:1;font-weight:900;pointer-events:none;
  text-shadow:3px 0 #68cfff,-3px 0 #68cfff,0 3px #68cfff,0 -3px #68cfff;
  animation:beetle-tornado-horn-v23 1.54s steps(4,end) both;
}
.battle-slot.right.attack-paper::after{right:auto;left:4%}
@keyframes beetle-tornado-horn-v23{
  0%,24%{opacity:0;scale:.4;translate:0 15px;rotate:0deg}
  33%{opacity:.65;scale:.9;translate:calc(12px * var(--attack-dir)) 0;rotate:35deg}
  43%,58%{opacity:1;scale:1.5;translate:calc(24px * var(--attack-dir)) -24px;rotate:130deg}
  72%{opacity:.6;scale:1.8;translate:calc(35px * var(--attack-dir)) -33px;rotate:270deg}
  88%,100%{opacity:0;scale:2;translate:calc(40px * var(--attack-dir)) -38px;rotate:360deg}
}
/* Wind rings are simple CSS shapes: no additional image downloads. */
.tornado-vortex-v23{position:absolute;z-index:7;left:25%;bottom:33px;
  width:116px;height:115px;pointer-events:none;
  translate:-50% 0;isolation:isolate;
  animation:tornado-vortex-arrive-v23 1.08s steps(8,end) both;
}
.tornado-vortex-v23.right{left:75%}
.tornado-vortex-v23::before,.tornado-vortex-v23::after,.tornado-vortex-v23 .wind-core{
  content:'';position:absolute;left:9%;top:24%;height:63%;width:83%;border-radius:50%;
  box-sizing:border-box;border:7px solid transparent;border-top-color:#dbffff;
  border-left-color:#64d6ff;border-right-color:#42baf0;
  filter:drop-shadow(2px 2px 0 #1b648e);
  animation:tornado-ring-spin-v23 .28s steps(6,end) infinite;
}
.tornado-vortex-v23::after{left:20%;top:4%;width:61%;height:51%;
  border-width:6px;border-top-color:#fff8d5;border-right-color:#b4f8ff;
  animation-duration:.22s;animation-direction:reverse;
}
.tornado-vortex-v23 .wind-core{left:18%;top:54%;height:45%;width:66%;border-width:5px;
  border-top-color:#a1efff;border-left-color:#dcffff;border-right-color:#e6ffff;
  animation-duration:.34s;
}
@keyframes tornado-ring-spin-v23{from{rotate:0deg}to{rotate:360deg}}
@keyframes tornado-vortex-arrive-v23{
  0%{opacity:0;scale:.35 .5}
  12%{opacity:.7;scale:.65 .7}
  32%,62%{opacity:1;scale:1.08 1.12}
  78%{opacity:.9;scale:1 .97}
  100%{opacity:0;scale:1.35 .32}
}
/* The defender rises, spins in the vortex, and slams down. */
.battle-slot.tornado-thrown-v23{z-index:9;animation:beetle-tornado-thrown-v23 1.08s steps(18,end) both}
.battle-slot.tornado-thrown-v23 .beetle-idle{animation-play-state:paused}
@keyframes beetle-tornado-thrown-v23{
  0%{opacity:1;translate:0 0;rotate:0deg;scale:1}
  13%{opacity:1;translate:calc(10px * var(--attack-dir)) -14px;rotate:calc(20deg * var(--attack-dir));scale:1}
  27%{opacity:.92;translate:calc(-7px * var(--attack-dir)) -44px;rotate:calc(94deg * var(--attack-dir));scale:.9}
  43%{opacity:1;translate:calc(20px * var(--attack-dir)) -54px;rotate:calc(173deg * var(--attack-dir));scale:.89}
  57%{opacity:1;translate:calc(-12px * var(--attack-dir)) -44px;rotate:calc(262deg * var(--attack-dir));scale:.92}
  72%{opacity:1;translate:calc(20px * var(--attack-dir)) -18px;rotate:calc(333deg * var(--attack-dir));scale:.98}
  82%{opacity:1;translate:calc(30px * var(--attack-dir)) 7px;rotate:calc(360deg * var(--attack-dir));scale:1.11 .8}
  89%{opacity:.78;translate:calc(22px * var(--attack-dir)) 1px;rotate:calc(365deg * var(--attack-dir));scale:1 .94}
  96%{opacity:1;translate:calc(5px * var(--attack-dir)) -5px;rotate:calc(360deg * var(--attack-dir));scale:1}
  100%{opacity:1;translate:0 0;rotate:calc(360deg * var(--attack-dir));scale:1}
}
.tornado-groundburst-v23{position:absolute;z-index:11;pointer-events:none;left:25%;bottom:25px;
  width:110px;height:55px;translate:-50% 0;animation:tornado-dust-v23 .48s steps(6,end) both;
}
.tornado-groundburst-v23.right{left:75%}
.tornado-groundburst-v23::before{content:'✹';display:block;text-align:center;font-size:72px;line-height:1;color:#e9e0b3;
  text-shadow:3px 0 #af9c65,-3px 0 #af9c65,0 3px #af9c65,0 -3px #af9c65}

s"></div></div></div><div id="matchNotice" class="box"></div><div id="matchMoves" class="grid three moves"></div><div class="box log" id="matchLog"></div></div><button onclick="leaveRoom()">ルームを退出</button></div><div id="debug" class="hidden"><div class="box"><h2>🛠️ 開発者用テストバトル</h2><p class="muted">両方の生き物と技を指定して1ターンずつ検証できます。オンライン対戦には影響しません。</p><div class="grid"><label>左の生き物<select id="debugLeft"></select></label><label>右の生き物<select id="debugRight"></select></label></div><button class="gold" style="width:100%;margin-top:12px" onclick="startDebug()">対戦を開始・リセット</button></div><div id="debugBattle" class="hidden"><div id="debugArena" class="battle-arena"></div><div class="box"><div id="debugStage" style="text-align:center;color:#ffdc6a;font-weight:bold"></div><div class="grid"><div class="card"><div id="debugApic" class="big"></div><b id="debugAname"></b><div id="debugAhp"></div><div class="bar"><div id="debugAbar"></div></div><div id="debugAstatus" class="muted"></div></div><div class="card"><div id="debugEpic" class="big"></div><b id="debugEname"></b><div id="debugEhp"></div><div class="bar red"><div id="debugEbar"></div></div><div id="debugEstatus" class="muted"></div></div></div></div><div class="box"><div class="grid"><label>左のHP<input id="debugLeftHp" type="number" min="0" onchange="setDebugHp()"></label><label>右のHP<input id="debugRightHp" type="number" min="0" onchange="setDebugHp()"></label></div><p class="muted">HPを変更すると捕食者や底力の条件をすぐ試せます。</p><div class="grid"><div><b>左の技</b><div id="debugLeftMoves" class="moves"></div></div><div><b>右の技</b><div id="debugRightMoves" class="moves"></div></div></div><button class="gold" style="width:100%;margin-top:12px" onclick="debugPlay()">▶ この組み合わせで1ターン実行</button><p id="debugNotice" class="muted"></p></div><div class="box log" id="debugLog"></div></div><button onclick="show('menu')">タイトルに戻る</button></div><div id="arcade" class="hidden"><div id="arcadeArena" class="battle-arena"></div><div class="box"><div id="stage" style="text-align:center;color:#ffdc6a;font-weight:bold"></div><div class="grid"><div class="card"><div id="apic" class="big"></div><b id="aname"></b><div id="ahp"></div><div class="bar"><div id="abar"></div></div><div id="astatus" class="status"></div></div><div class="card"><div id="epic" class="big"></div><b id="ename"></b><div id="ehp"></div><div class="bar red"><div id="ebar"></div></div><div id="estatus" class="status"></div></div></div></div><div id="notice" class="box"></div><div id="arcMoves" class="grid three moves"></div><div class="box log" id="arcLog"></div><div id="nextPanel" class="box hidden"><h2 id="nextTitle"></h2><p id="nextDesc"></p><button class="gold" id="nextButton">次へ</button></div><button onclick="show('menu')">タイトルに戻る</button></div><p class="footer">試作版：ルームはサーバー再起動で消えます。カブトムシの特殊効果を先行実装中。</p></div><script>

/* Beetle visual layer: hooks into existing renders, never changes battle results. */
let beetleIdleReady=false,beetleIdleRequested=false;
function requestBeetleIdle(){
 if(beetleIdleRequested)return;
 beetleIdleRequested=true;
 const img=new Image();
 img.onload=()=>{beetleIdleReady=true;document.querySelectorAll('.beetle-idle').forEach(el=>el.classList.add('idle-ready'));};
 img.onerror=()=>{beetleIdleRequested=false;};
 img.src='/assets/beetle-idle.png?v=idle-v2';
}
const beetleAnimationTimers=new Map();
const arenaVisualVersions=new Map();
function resetArenaVisual(id){
 arenaVisualVersions.set(id,(arenaVisualVersions.get(id)||0)+1);
 const host=document.getElementById(id);if(!host)return;
 host.dataset.pair='';host.dataset.round='';
 host.querySelectorAll('.damage-float,.tornado-vortex-v23,.tornado-groundburst-v23,.beetle-win-halo-v25,.beetle-win-tag-v25,.beetle-ko-tag-v26').forEach(el=>el.remove());
 host.querySelectorAll('.tornado-thrown-v23,.tornado-boost-v23,.beetle-win-v25').forEach(el=>el.classList.remove('tornado-thrown-v23','tornado-boost-v23','beetle-win-v25','beetle-ko-v26'));
}

function buildArena(containerId,leftCard,rightCard){
 const host=document.getElementById(containerId);if(!host)return;
 const key=leftCard+':'+rightCard;
 if(host.dataset.pair===key)return;
 host.dataset.pair=key;host.replaceChildren();
 const label=document.createElement('div');label.className='battle-move-name';label.textContent='⚔️ BATTLE';
 for(const side of ['left','right']){const floor=document.createElement('div');floor.className='battle-floor '+side;host.append(floor);const slot=document.createElement('div');slot.className='battle-slot '+side;const card=side==='left'?leftCard:rightCard;const sprite=document.createElement('div');sprite.className=card===0?'battle-sprite beetle-idle':'battle-emoji';if(card===0){sprite.setAttribute('role','img');sprite.setAttribute('aria-label','カブトムシ');if(beetleIdleReady)sprite.classList.add('idle-ready');else requestBeetleIdle();}else sprite.textContent=icons[card];slot.append(sprite);host.append(slot);}host.append(label);
}
function animateArena(id,side,handIndex,hit){
 const host=document.getElementById(id);if(!host)return;
 const slot=host.querySelector('.battle-slot.'+side);if(!slot)return;
 const cls=['attack-rock','attack-scissors','attack-paper'][handIndex];
 slot.classList.remove('attack-rock','attack-scissors','attack-paper','hurt','victory','beetle-win-v25','swipe-launch-v22','swipe-impact-v22','headbutt-impact','tornado-thrown-v23','tornado-boost-v23','beetle-ko-v26','beetle-hit-v24','beetle-hit-light-v24','beetle-hit-medium-v24','beetle-hit-heavy-v24');

 slot.classList.add(hit?'hurt':cls);

}
function playBeetleHitV24(id,side,damage){
 const host=document.getElementById(id);

 const tier=damage>=100?'heavy':damage>=50?'medium':'light';
 slot.classList.remove('beetle-hit-v24','beetle-hit-light-v24','beetle-hit-medium-v24','beetle-hit-heavy-v24');

}
function showHpFloat(host,side,delta){
 if(!delta)return;

 const value=document.createElement('div');value.className='damage-float '+side+(delta<0?' heal':'');

 host.append(value);
 setTimeout(()=>value.remove(),1800);
}
function visualRound(id,lcard,rcard,lh,rh,who,hpDelta=null){

// Victory v2.5: triggered after a confirmed KO, separate from damage calculations.
function queueBeetleVictoryV25(arenaId,leftCard,rightCard,leftHP,rightHP,roundWinner,roundMove){
 const winningSide=leftHP>0&&rightHP<=0?'left':rightHP>0&&leftHP<=0?'right':null;
 if(!winningSide||(winningSide==='left'?leftCard:rightCard)!==0)return;
 const winnerIndex=winningSide==='left'?0:1;
 const isTornadoFinish=roundWinner===winnerIndex&&roundMove===2;
 const delay=isTornadoFinish?2700:1300;
 const version=arenaVisualVersions.get(arenaId);
 setTimeout(()=>{
  if(arenaVisualVersions.get(arenaId)!==version)return;
  const host=document.getElementById(arenaId);
  if(!host||!host.isConnected)return;
  const slot=host.querySelector('.battle-slot.'+winningSide);
  if(!slot||!slot.querySelector('.beetle-idle'))return;
  host.querySelectorAll('.beetle-win-halo-v25,.beetle-win-tag-v25').forEach(el=>el.remove());
  slot.classList.remove('attack-rock','attack-scissors','attack-paper','hurt','victory','beetle-win-v25','tornado-boost-v23');
  void slot.offsetWidth;
  slot.classList.add('beetle-win-v25');
  const halo=document.createElement('div');halo.className='beetle-win-halo-v25 '+winningSide;halo.setAttribute('aria-hidden','true');host.append(halo);
  const tag=document.createElement('div');tag.className='beetle-win-tag-v25 '+winningSide;tag.textContent='🏆 WIN!';tag.setAttribute('aria-label','カブトムシの勝利');host.append(tag);
  const label=host.querySelector('.battle-move-name');if(label)label.textContent='🏆 カブトムシ WIN！';
 },delay);
}


// Defeat v2.6: presentation only, called after the rules engine confirms HP <= 0.
// Works for one KO, double KO, poison KO, either beetle position and all match modes.
function queueBeetleDefeatV26(arenaId,leftCard,rightCard,leftHP,rightHP,roundWinner,roundMove){
 const defeated=[];
 if(leftCard===0&&leftHP<=0)defeated.push('left');
 if(rightCard===0&&rightHP<=0)defeated.push('right');
 if(!defeated.length)return;
 const attackerCard=roundWinner===0?leftCard:roundWinner===1?rightCard:null;
 const isTornado=(attackerCard===0&&roundMove===2);
 const delay=isTornado?2070:1190;
 const version=arenaVisualVersions.get(arenaId);
 setTimeout(()=>{
  if(arenaVisualVersions.get(arenaId)!==version)return;
  const host=document.getElementById(arenaId);
  if(!host||!host.isConnected)return;
  for(const side of defeated){
   const slot=host.querySelector('.battle-slot.'+side);
   if(!slot||!slot.querySelector('.beetle-idle'))continue;
   // An old hit cleanup must not cancel the permanent defeat pose.
   clearTimeout(beetleAnimationTimers.get(arenaId+side));
   slot.classList.remove('attack-rock','attack-scissors','attack-paper','hurt','victory',
    'beetle-win-v25','swipe-launch-v22','swipe-impact-v22','headbutt-impact',
    'tornado-thrown-v23','tornado-boost-v23','beetle-hit-v24',
    'beetle-hit-light-v24','beetle-hit-medium-v24','beetle-hit-heavy-v24','beetle-ko-v26');
   void slot.offsetWidth;
   slot.classList.add('beetle-ko-v26');
   const prev=host.querySelector('.beetle-ko-tag-v26.'+side);
   if(prev)prev.remove();
   const tag=document.createElement('div');tag.className='beetle-ko-tag-v26 '+side;
   tag.textContent='💀 K.O.';tag.setAttribute('aria-label','カブトムシが戦闘不能');
   host.append(tag);
  }
  if(leftHP<=0&&rightHP<=0){
   const title=host.querySelector('.battle-move-name');
   if(title)title.textContent='💀 DOUBLE K.O.！';
  }
 },delay);
}

function setupCardsSelection(){
  setupCardsSelectionRaw();
  const panel=$('description');
  const handLabels=['rock','scissors','paper'];
  [...panel.querySelectorAll('p')].forEach(p=>{
    const raw=p.textContent;
    for(let i=0;i<3;i++){
      // 必殺技には「★ 必殺技」が技名と説明の間に入る場合がある。
      // その表記も含めて技を認識し、全技をカードに変換する。
      const prefix=hand[i]+' '+moves[chosen][i];
      if(!raw.startsWith(prefix))continue;
      const rest=raw.slice(prefix.length);
      const match=rest.match(/^(?:\s*★\s*必殺技)?\s*：/);
      if(!match)continue;
      const isSpecial=i===special[chosen];
      const tile=document.createElement('div');
      tile.className='intro-move hand-'+handLabels[i]+(isSpecial?' is-special':'');
      const heading=document.createElement('div');heading.className='intro-move-title';
      const label=document.createElement('strong');label.textContent=hand[i]+' '+moves[chosen][i];heading.append(label);
      if(isSpecial){const tag=document.createElement('span');tag.className='intro-special-tag';tag.textContent='★ 必殺技';heading.append(tag);}
      const detail=document.createElement('div');detail.className='intro-move-detail';detail.textContent=rest.slice(match[0].length);
      tile.append(heading,detail);p.replaceWith(tile);break;
    }
  });
}
function api(url,data){return fetch('/api/'+url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(async r=>{const x=await r.json();if(!r.ok)throw Error(x.error);return x;});}

async function joinRoom(){try{const d=await api('join',{name:$('playerName').value,card:+$('onlineCard').value,code:$('roomInput').value});enterRoom(d);}catch(e){$('onlineError').textContent=e.message;}}
function enterRoom(d){resetArenaVisual('onlineArena');session=d;$('roomCode').textContent=d.code;show('match');refresh();poll=setInterval(refresh,1300);}

function win(a,b){return a===b?0:((a===0&&b===1)||(a===1&&b===2)||(a===2&&b===0)?1:-1);}
function fighter(card,health){return {card,hp:health,poison:0,streak:0,howl:0,lastHand:null,boost:false,seal:0,steel:0,attackBonus:0,counter:false,catLock:0,palmBlocked:false,roar:0,lionBonus:0,gorillaBonus:0,gorillaForce:false,gorillaDebt:0,gorillaSeal:-1,gorillaGuard:0,gorillaAttack:0,eagleControl:0,crocSeal:-1,cassSeal:-1};}

function isBlocked(f,i){return f.gorillaSeal===i||f.crocSeal===i||f.cassSeal===i;}
