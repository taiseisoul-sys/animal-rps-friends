<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生き物じゃんけん ARCADE ONLINE</title><style>*{box-sizing:border-box}body{margin:0;background:#080e22;color:#f4f6ff;font:15px system-ui,sans-serif}.wrap{max-width:750px;margin:auto;padding:18px}.hero{text-align:center;padding:20px 0}.hero h1{color:#ffd45d;text-shadow:0 0 20px #ffbc4b66;margin:8px 0}.box{background:#172143;border:1px solid #455586;border-radius:15px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}button,input,select{font:inherit;border-radius:10px;padding:12px;border:1px solid #6675a8}button{background:#344573;color:white;font-weight:bold;cursor:pointer}button:disabled{opacity:.35}.gold{background:linear-gradient(90deg,#d59520,#ffdc6c);color:#201500}.purple{background:#6548b7}input,select{background:#0e1731;color:white;width:100%}.hidden{display:none!important}.muted{color:#b2bfdc;font-size:13px}.big{font-size:44px}.bar{height:12px;background:#384366;border-radius:8px;overflow:hidden}.bar>div{height:100%;background:#39d88b}.bar.red>div{background:#f56b80}.log{max-height:250px;overflow:auto;font-size:13px;line-height:1.8}.log div{border-bottom:1px solid #33416b;padding:4px}.card{text-align:center}.card b{display:block}#notice{color:#ffda75;font-weight:800;text-align:center;padding:10px}.badge{display:inline-block;border:1px solid #6372a7;border-radius:30px;padding:5px 10px;font-size:12px}#cards button{min-height:92px}.moves button{min-height:130px;padding:8px 4px;font-size:12px;overflow-wrap:anywhere}.moves span{display:block;font-size:26px}.moves small{display:block;color:#ffe48b}.moves em{display:block;font-size:11px;font-style:normal;color:#c7d6fa;margin-top:6px;line-height:1.45}.status{color:#ffe48b;font-size:12px;margin-top:6px}.footer{font-size:12px;color:#9aaac9;text-align:center;margin:20px 0}#debug .moves button{min-height:64px;width:100%;padding:8px;margin-top:5px;font-size:12px}#debug .moves button.selected{border-color:#ffdc6a;background:#5b4c80}#debug label{font-size:12px}#debug input{padding:7px}
/* RPS hand colors and special-move emphasis (visual only) */
.hand-rock{--hand-accent:#f36a76;--hand-bg:#572b45;--hand-edge:#e86c78}
.hand-scissors{--hand-accent:#80bbff;--hand-bg:#263f72;--hand-edge:#639ff0}
.hand-paper{--hand-accent:#8ee5a9;--hand-bg:#245443;--hand-edge:#56c98a}
.moves button.rps-move{background:linear-gradient(155deg,var(--hand-bg),#1a2544 92%);border:2px solid var(--hand-edge);color:#fff;position:relative;transition:filter .15s,transform .15s}
.moves button.rps-move>span{color:var(--hand-accent);text-shadow:0 1px 12px #0008}
.moves button.rps-move:enabled:active{transform:scale(.97)}
.moves button.rps-move:disabled{opacity:.4;filter:grayscale(.5)}
.moves button.rps-move.is-special{border:3px solid #ffdb68;background:linear-gradient(145deg,#675020,#302647 65%,var(--hand-bg));box-shadow:inset 0 0 0 1px #ffe6a45e,0 0 13px #ffc64250}
.moves button.rps-move.is-special>span{color:#ffdf7b}
.special-tag{display:block;width:fit-content;max-width:100%;margin:5px auto;padding:3px 8px;border:1px solid #ffdb68;border-radius:30px;background:#5a3b13;color:#ffecab;font-size:11px;font-weight:900;letter-spacing:.04em}
#debug .moves button.rps-move{min-height:78px;padding:8px 5px}
#debug .moves button.rps-move.selected{outline:3px solid #fff0b3;outline-offset:1px;box-shadow:0 0 0 2px #e0b84a,0 0 14px #f9d26b6b}
#description .move-detail{padding:9px 10px;border-left:4px solid var(--hand-edge);background:linear-gradient(90deg,var(--hand-bg),transparent);border-radius:8px;line-height:1.6}
#description .move-detail.is-special{border:2px solid #f4c85a;border-left:5px solid #ffe08a;background:linear-gradient(100deg,#59431d,#262643);box-shadow:0 0 12px #f5c55e35}
#description .move-detail .special-inline{color:#ffe18a;font-weight:900;margin-left:5px}
</style></head><body><div class="wrap"><header class="hero"><div class="muted">ANIMAL RPS BATTLE</div><h1>⚡ 生き物じゃんけん ⚡</h1><div class="badge">ARCADE × ONLINE</div></header><div id="menu" class="box"><h2>🎮 ゲームモード</h2><div class="grid"><button class="gold" onclick="show('select')">🏆 アーケード<br><small>CPU 5連戦</small></button><button class="purple" onclick="show('online')">🌐 ルームマッチ<br><small>友達と対戦</small></button></div><button style="width:100%;margin-top:12px" onclick="openDebug()">🛠️ 開発者用テストバトル</button><p class="muted">10種類の生き物から選択。オンライン対戦は2人同時参加が必要です。</p></div><div id="select" class="hidden"><h2>🃏 キャラクター選択</h2><div id="cards" class="grid"></div><div class="box" id="description"></div><button class="gold" style="width:100%" onclick="startArcade()">▶ アーケードに出撃</button><button onclick="show('menu')">戻る</button></div><div id="online" class="hidden"><div class="box"><h2>🌐 オンラインルーム</h2><label>プレイヤー名<input id="playerName" maxlength="20" value="PLAYER"></label><p>使用するカード</p><select id="onlineCard"></select><div class="grid" style="margin-top:12px"><button class="gold" onclick="createRoom()">ルームを作成</button><button onclick="joinRoom()">番号で参加</button></div><p><input id="roomInput" inputmode="numeric" maxlength="6" placeholder="6桁のルーム番号"></p><p id="onlineError" class="muted"></p></div><button onclick="show('menu')">戻る</button></div><div id="match" class="hidden"><div class="box"><h2>🔗 ルーム <span id="roomCode"></span></h2><button onclick="copyRoom()">招待リンクをコピー</button><p id="roomStatus" class="muted"></p></div><div id="matchBattle" class="hidden"><div class="grid"><div class="box card"><div id="mpic" class="big"></div><b id="mname"></b><div id="mhp"></div><div class="bar"><div id="mbar"></div></div><div id="mstatus" class="status"></div></div><div class="box card"><div id="opic" class="big"></div><b id="oname"></b><div id="ohp"></div><div class="bar red"><div id="obar"></div></div><div id="ostatus" class="status"></div></div></div><div id="matchNotice" class="box"></div><div id="matchMoves" class="grid three moves"></div><div class="box log" id="matchLog"></div></div><button onclick="leaveRoom()">ルームを退出</button></div><div id="debug" class="hidden"><div class="box"><h2>🛠️ 開発者用テストバトル</h2><p class="muted">両方の生き物と技を指定して1ターンずつ検証できます。オンライン対戦には影響しません。</p><div class="grid"><label>左の生き物<select id="debugLeft"></select></label><label>右の生き物<select id="debugRight"></select></label></div><button class="gold" style="width:100%;margin-top:12px" onclick="startDebug()">対戦を開始・リセット</button></div><div id="debugBattle" class="hidden"><div class="box"><div id="debugStage" style="text-align:center;color:#ffdc6a;font-weight:bold"></div><div class="grid"><div class="card"><div id="debugApic" class="big"></div><b id="debugAname"></b><div id="debugAhp"></div><div class="bar"><div id="debugAbar"></div></div><div id="debugAstatus" class="muted"></div></div><div class="card"><div id="debugEpic" class="big"></div><b id="debugEname"></b><div id="debugEhp"></div><div class="bar red"><div id="debugEbar"></div></div><div id="debugEstatus" class="muted"></div></div></div></div><div class="box"><div class="grid"><label>左のHP<input id="debugLeftHp" type="number" min="0" onchange="setDebugHp()"></label><label>右のHP<input id="debugRightHp" type="number" min="0" onchange="setDebugHp()"></label></div><p class="muted">HPを変更すると捕食者や底力の条件をすぐ試せます。</p><div class="grid"><div><b>左の技</b><div id="debugLeftMoves" class="moves"></div></div><div><b>右の技</b><div id="debugRightMoves" class="moves"></div></div></div><button class="gold" style="width:100%;margin-top:12px" onclick="debugPlay()">▶ この組み合わせで1ターン実行</button><p id="debugNotice" class="muted"></p></div><div class="box log" id="debugLog"></div></div><button onclick="show('menu')">タイトルに戻る</button></div><div id="arcade" class="hidden"><div class="box"><div id="stage" style="text-align:center;color:#ffdc6a;font-weight:bold"></div><div class="grid"><div class="card"><div id="apic" class="big"></div><b id="aname"></b><div id="ahp"></div><div class="bar"><div id="abar"></div></div><div id="astatus" class="status"></div></div><div class="card"><div id="epic" class="big"></div><b id="ename"></b><div id="ehp"></div><div class="bar red"><div id="ebar"></div></div><div id="estatus" class="status"></div></div></div></div><div id="notice" class="box"></div><div id="arcMoves" class="grid three moves"></div><div class="box log" id="arcLog"></div><div id="nextPanel" class="box hidden"><h2 id="nextTitle"></h2><p id="nextDesc"></p><button class="gold" id="nextButton">次へ</button></div><button onclick="show('menu')">タイトルに戻る</button></div><p class="footer">試作版：ルームはサーバー再起動で消えます。カブトムシの特殊効果を先行実装中。</p></div><script>
const names=['カブトムシ','パラポネラ','クロオオアリ','オオカマキリ','ネコ','ライオン（オス）','マウンテンゴリラ','ワシ','イリエワニ','ヒクイドリ'];const icons=['🪲','🐜','🐜','🦗','🐈','🦁','🦍','🦅','🐊','🐦'];const hp=[180,150,160,200,250,300,280,180,300,160];const moves=[['頭突き','角払い','トルネードスロー'],['ヴェノムエンド','毒針','ポイズンヒール'],['パワーバイト','アゴばさみ','アントガード'],['プレデタークロー','マンティスブレード','ハンティングステップ'],['キャットインパクト','ネコひっかき','甘える'],['プライドクラッシュ','キングスクラッチ','キングズロア'],['ゴライアスパンチ','ジャングルキング','貪る'],['イーグルクロー','ゴッドバード','スカイハント'],['クロコダイルテール','引き裂く爪','デビルバイト'],['遠吠え','ディノ・ラプトル・レイド','ラストダンス']];const dmg=[[40,70,100],[0,20,0],[120,50,0],[50,0,60],[100,40,0],[140,50,30],[200,60,0],[70,200,30],[60,40,50],[20,100,20]];const special=[2,0,0,1,0,2,0,2,2,1],hand=['✊','✌️','✋'];const desc=['勝利時10%で相手の必殺技を次の1ターン封印','連続使用2回目以降は35ダメージ完全固定','必殺技。勝利時、次の通常攻撃を1.5倍に強化'];const antDesc=['必殺技。勝利時、次の攻撃＋10（反射にも適用・消費）','勝利時、次の攻撃＋20（反射にも適用・消費）','勝利時、次に受ける技ダメージの50%を反射。黒鋼鎧と技強化も加算。あいこでは消費しない'];const mantisDesc=['50ダメージを与える。','勝利時、相手の現在HPを半分にする。捕食者発動中は即気絶。回復なし。','20ダメージを3回与える。'];const catDesc=['必殺技。100ダメージ。命中時、自分のHPを30回復。','20ダメージを2回与える。各ヒットの実ダメージの半分を回復（切り捨て）。','勝利時、相手は3ターンの間、直前と同じ手を連続で出せない。'];const lionDesc=['140ダメージ。成功時、自分も50ダメージを受ける。','50ダメージ。成功時、次に成功する攻撃ダメージ＋30（成功まで持続）。','30ダメージ。成功時、次ターン自分の技が必ず成功・相手の技は失敗。2回連続使用不可。'];const poisonDesc=['必殺技。勝利時、相手が毒状態なら即気絶。毒でなければ効果なし','勝利時、相手の毒を3ターン加算（100%）','勝利時、相手が毒なら自分のHPを120回復（最大150）。毒でなければ相手に毒2ターン'];const $=id=>document.getElementById(id);let chosen=0,arc=null,session=null,poll=null;
function show(id){for(const s of ['menu','select','online','match','arcade','debug'])$(s).classList.toggle('hidden',s!==id);if(id!=='match'&&poll){clearInterval(poll);poll=null;}}
function setupCards(){names.forEach((n,i)=>{const b=document.createElement('button');b.innerHTML=icons[i]+'<br>'+n+'<br>HP '+hp[i];b.onclick=()=>{chosen=i;setupCardsSelection();};$('cards').append(b);$('onlineCard').add(new Option(icons[i]+' '+n,i));});setupCardsSelection();}
const cardStyles=['虫 / アタック型・火力 / 初心者','虫 / テクニック型・毒 / 上級者','虫 / ガード型・あいこ / 上級者','虫 / テクニック・体力管理 / 中級者','動物 / ガード・回復型 / 初心者','動物 / アタック・妨害型 / 上級者'];
function decorateMoveDetail(el,card,i){el.classList.add('move-detail','hand-'+['rock','scissors','paper'][i]);if(i===special[card]){el.classList.add('is-special');const tag=document.createElement('span');tag.className='special-inline';tag.textContent='★ 必殺技';el.append(tag);}}
function setupCardsSelection(){[...$('cards').children].forEach((b,i)=>b.style.borderColor=i===chosen?'#ffdf62':'#6675a8');$('description').innerHTML='';const t=document.createElement('div');t.textContent=names[chosen]+' / '+(cardStyles[chosen]||'スタイル未設定');$('description').append(t);if(chosen===0){const p=document.createElement('p');p.textContent='💪 固有能力「底力」：HP36以下で全攻撃1.8倍（角払い連続使用時の35固定は除く）';$('description').append(p);desc.forEach((s,i)=>{const d=document.createElement('p');d.textContent=hand[i]+' '+moves[0][i]+'：'+s;decorateMoveDetail(d,0,i);$('description').append(d);});}if(chosen===2){const p=document.createElement('p');p.textContent='🛡️ 固有能力「黒鋼鎧」：あいこで自分0ダメージ・相手20ダメージ。あいこごと攻撃＋10（試合中永続）。';$('description').append(p);antDesc.forEach((s,i)=>{const d=document.createElement('p');d.textContent=hand[i]+' '+moves[2][i]+'：'+s;decorateMoveDetail(d,2,i);$('description').append(d);});}if(chosen===3){const p=document.createElement('p');p.textContent='🧬 固有能力「捕食者」：相手の現在HPが最大HPの50%以下なら、攻撃ダメージが1.5倍。 / 捕食者発動中、攻撃で実際に与えたダメージの30%を回復（小数点以下切り捨て）。マンティスブレードは回復なし。';$('description').append(p);mantisDesc.forEach((s,i)=>{const d=document.createElement('p');d.textContent=hand[i]+' '+moves[3][i]+'：'+s;decorateMoveDetail(d,3,i);$('description').append(d);});}if(chosen===4){const p=document.createElement('p');p.textContent='🧬 固有能力「ゴロゴロ回復」：毎ターン終了時HP10回復。最大250、戦闘不能時は発動しない。';$('description').append(p);catDesc.forEach((s,i)=>{const d=document.createElement('p');d.textContent=hand[i]+' '+moves[4][i]+'：'+s;decorateMoveDetail(d,4,i);$('description').append(d);});}if(chosen===5){const p=document.createElement('p');p.textContent='👑 固有能力「王者の領域」：毎ターン技選択前に70%の確率で、相手の✋をそのターン封印。';$('description').append(p);lionDesc.forEach((s,i)=>{const d=document.createElement('p');d.textContent=hand[i]+' '+moves[5][i]+'：'+s;decorateMoveDetail(d,5,i);$('description').append(d);});}if(chosen===1){const p=document.createElement('p');p.textContent='☠️ 固有能力「毒の沼地」：試合開始時、相手に毒5ターン。毎ターン終了時20ダメージ。毒ターンは加算される。';$('description').append(p);poisonDesc.forEach((s,i)=>{const d=document.createElement('p');d.textContent=hand[i]+' '+moves[1][i]+'：'+s;decorateMoveDetail(d,1,i);$('description').append(d);});}}
function api(url,data){return fetch('/api/'+url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(async r=>{const x=await r.json();if(!r.ok)throw Error(x.error);return x;});}
async function createRoom(){try{const d=await api('create',{name:$('playerName').value,card:+$('onlineCard').value});enterRoom(d);}catch(e){$('onlineError').textContent=e.message;}}
async function joinRoom(){try{const d=await api('join',{name:$('playerName').value,card:+$('onlineCard').value,code:$('roomInput').value});enterRoom(d);}catch(e){$('onlineError').textContent=e.message;}}
function enterRoom(d){session=d;$('roomCode').textContent=d.code;show('match');refresh();poll=setInterval(refresh,1300);}
function leaveRoom(){session=null;show('menu');}
function copyRoom(){const link=location.origin+'/?room='+session.code;if(navigator.clipboard)navigator.clipboard.writeText(link).then(()=>$('roomStatus').textContent='招待リンクをコピーしました').catch(()=>$('roomStatus').textContent=link);else $('roomStatus').textContent=link;}
function status(p,op){let a=[];if(p.card===0){if(p.hp<=36)a.push('💪 底力発動中');if(p.boost)a.push('🌪️ 次の通常攻撃1.5倍');if(p.lastHand===1)a.push('角払い連続使用は35固定');}if(p.card===2){a.push('🛡️ 黒鋼鎧：攻撃＋'+p.steel+'（永続）');if(p.attackBonus)a.push('⚔️ 次の攻撃＋'+p.attackBonus);if(p.counter)a.push('🛡️ 反射待機中');}if(p.card===3){const active=op&&op.hp>0&&op.hp<=hp[op.card]/2;a.push(active?'🧬 捕食者発動中！ 攻撃1.5倍・与ダメージ30%回復':'🧬 捕食者：待機中（相手HP50%以下で発動）');}if(p.catLock>0)a.push('🐾 甘える：連続同手禁止 あと'+p.catLock+'T');if(p.card===4)a.push('🐈 ゴロゴロ回復：毎ターン10HP');if(p.card===5){a.push('👑 王者の領域：'+(op?.palmBlocked?'相手の✋封印中':'今ターン不発'));if(p.roar>0)a.push('🦁 王者の咆哮：このターン技が必ず成功');if(p.lionBonus)a.push('⚔️ 次の成功攻撃＋'+p.lionBonus);if(p.lastHand===2)a.push('キングズロア連続使用不可');}if(p.palmBlocked)a.push('👑 ✋封印中');if(p.seal>0)a.push('❌ 必殺技封印中：このターン使用不可');if(p.poison)a.push('☠️ 毒 '+p.poison+'T');return a.join(' / ');}
function moveButton(card,i,state,click,disabled){const b=document.createElement('button');b.classList.add('rps-move','hand-'+['rock','scissors','paper'][i]);if(i===special[card])b.classList.add('is-special');b.disabled=!!disabled||(i===special[card]&&state?.seal>0)||(state?.catLock>0&&i===state.lastHand)||(state?.palmBlocked&&i===2)||(card===5&&i===2&&state?.lastHand===2);const sp=document.createElement('span');sp.textContent=hand[i];b.append(sp,document.createTextNode(moves[card][i]));if(i===special[card]){const tag=document.createElement('strong');tag.className='special-tag';tag.textContent='★ 必殺技';b.append(tag);}const small=document.createElement('small');small.textContent=dmg[card][i]+' DMG'+(i===special[card]?' ★':'');b.append(small);if(card===0||card===1||card===2||card===3||card===4){const em=document.createElement('em');em.textContent=(card===0?desc:card===1?poisonDesc:card===2?antDesc:card===3?mantisDesc:catDesc)[i];b.append(em);if(card===0&&i===1&&state?.lastHand===1){const s=document.createElement('small');s.textContent='現在：35固定';b.append(s);}}if(i===special[card]&&state?.seal>0){const mark=document.createElement('strong');mark.textContent='❌ 封印中・使用不可';mark.style.cssText='display:block;color:#ff8798;font-size:12px;margin-top:6px';b.append(mark);b.style.borderColor='#e86b7c';}if((state?.catLock>0&&i===state.lastHand)||(state?.palmBlocked&&i===2)||(card===5&&i===2&&state?.lastHand===2)){const mark=document.createElement('strong');mark.textContent=state?.palmBlocked&&i===2?'👑 王者の領域：封印中':card===5&&i===2&&state?.lastHand===2?'👑 キングズロア：連続使用不可':'🐾 甘える：連続使用不可';mark.style.cssText='display:block;color:#ff8798;font-size:12px;margin-top:6px';b.append(mark);}b.onclick=click;return b;}
async function refresh(){if(!session)return;try{const r=await fetch('/api/room?code='+encodeURIComponent(session.code)+'&token='+encodeURIComponent(session.token),{cache:'no-store'});if(!r.ok)throw Error('ルームに接続できません');const d=await r.json();if(!session)return;$('roomStatus').textContent=d.phase==='waiting'?'友達の参加を待っています…':d.phase==='playing'?'対戦中 · TURN '+d.round:'対戦終了';$('matchBattle').classList.toggle('hidden',d.phase==='waiting');if(d.phase==='waiting')return;const me=d.players[d.you],op=d.players[1-d.you];for(const [p,prefix] of [[me,'m'],[op,'o']]){$(prefix+'pic').textContent=icons[p.card];$(prefix+'name').textContent=p.name+' · '+names[p.card];$(prefix+'hp').textContent='HP '+p.hp+'/'+hp[p.card];$(prefix+'bar').style.width=100*p.hp/hp[p.card]+'%';$(prefix+'status').textContent=status(p,prefix==='m'?op:me);}const log=$('matchLog');log.replaceChildren();d.history.slice().reverse().forEach(h=>{const div=document.createElement('div');div.textContent='TURN '+h.round+' '+hand[h.hands[d.you]]+' VS '+hand[h.hands[1-d.you]]+' — '+h.notes.join(' / ');log.append(div);});$('matchMoves').replaceChildren();if(d.phase==='finished'){$('matchNotice').textContent=d.winner==='draw'?'引き分け！':d.winner===d.you?'🏆 あなたの勝利！':'💀 相手の勝利！';return;}$('matchNotice').textContent=me.ready?'相手の手を待っています…':'手を選んでください（相手には公開されません）';moves[me.card].forEach((m,i)=>$('matchMoves').append(moveButton(me.card,i,{...me,preyHp:op.hp,preyMax:hp[op.card]},()=>api('move',{...session,hand:i}).then(refresh).catch(e=>alert(e.message)),me.ready)));}catch(e){$('roomStatus').textContent=e.message;}}
function win(a,b){return a===b?0:((a===0&&b===1)||(a===1&&b===2)||(a===2&&b===0)?1:-1);}
function fighter(card,health){return {card,hp:health,poison:0,streak:0,howl:0,lastHand:null,boost:false,seal:0,steel:0,attackBonus:0,counter:false,catLock:0,palmBlocked:false,roar:0,lionBonus:0};}
function rollLionAura(left,right){left.palmBlocked=right.card===5&&Math.random()<.7;right.palmBlocked=left.card===5&&Math.random()<.7;}
function startArcade(){const pool=names.map((_,i)=>i).filter(i=>i!==chosen).sort(()=>Math.random()-.5);arc={player:fighter(chosen,hp[chosen]),stage:1,pool:pool.slice(0,5),turn:1};show('arcade');startStage();}
function startStage(){const a=arc;const remaining=a.player.hp;a.player=fighter(a.player.card,remaining);a.enemy=fighter(a.pool[a.stage-1],hp[a.pool[a.stage-1]]);a.turn=1;if(a.player.card===1)a.enemy.poison+=5;if(a.enemy.card===1)a.player.poison+=5;rollLionAura(a.player,a.enemy);$('arcLog').replaceChildren();$('nextPanel').classList.add('hidden');arcRender();}
function arcLog(t){if(arc?.debug){const x=document.createElement('div');x.textContent=t;$('debugLog').prepend(x);return;}const x=document.createElement('div');x.textContent=t;$('arcLog').prepend(x);}
function arcRender(){if(arc?.debug){debugRender();return;}const a=arc,p=a.player,e=a.enemy;$('stage').textContent='STAGE '+a.stage+'/5 · TURN '+a.turn;for(const [f,prefix] of [[p,'a'],[e,'e']]){$(prefix+'pic').textContent=icons[f.card];$(prefix+'name').textContent=names[f.card];$(prefix+'hp').textContent=f.hp+'/'+hp[f.card];$(prefix+'bar').style.width=100*f.hp/hp[f.card]+'%';$(prefix+'status').textContent=status(f,f===p?e:p);}$('notice').textContent='技を選択！';$('arcMoves').replaceChildren();moves[p.card].forEach((m,i)=>$('arcMoves').append(moveButton(p.card,i,{...p,preyHp:e.hp,preyMax:hp[e.card]},()=>arcPlay(i),false)));}
function arcPlay(ph,forcedEh=null){const a=arc,p=a.player,e=a.enemy;if(p.seal>0&&ph===special[p.card])return;if(p.catLock>0&&ph===p.lastHand)return;if(p.palmBlocked&&ph===2)return;if(p.card===5&&ph===2&&p.lastHand===2)return;let eh=forcedEh===null?Math.floor(Math.random()*3):forcedEh;if(p.catLock>0&&ph===p.lastHand)return;if(forcedEh!==null&&e.catLock>0&&eh===e.lastHand)return;if(forcedEh!==null&&e.seal>0&&eh===special[e.card])return;if(forcedEh!==null&&((e.palmBlocked&&eh===2)||(e.card===5&&eh===2&&e.lastHand===2)))return;if((e.seal>0&&eh===special[e.card])||(e.catLock>0&&eh===e.lastHand)||(e.palmBlocked&&eh===2)||(e.card===5&&eh===2&&e.lastHand===2)){const allowed=[0,1,2].filter(i=>!(e.seal>0&&i===special[e.card])&&!(e.catLock>0&&i===e.lastHand)&&!(e.palmBlocked&&i===2)&&!(e.card===5&&i===2&&e.lastHand===2));eh=allowed[Math.floor(Math.random()*allowed.length)];}const r=win(ph,eh),notes=[];arcLog('TURN '+a.turn+' '+hand[ph]+' VS '+hand[eh]);const oldSeal=[p.seal,e.seal],oldLock=[p.catLock,e.catLock];const roarP=p.roar>0,roarE=e.roar>0;let outcome=roarP&&!roarE?1:roarE&&!roarP?-1:r;if(roarP||roarE)notes.push('👑 キングズロア：じゃんけん勝敗を上書き！');if(outcome===0){for(const f of [p,e])if(f.card===2){f.steel+=10;notes.push(names[f.card]+'：🛡️ 黒鋼鎧 永続攻撃＋10（累計＋'+f.steel+'）');}p.hp-=e.card===2?20:p.card===2?0:10;e.hp-=p.card===2?20:e.card===2?0:10;p.streak=e.streak=0;notes.push(p.card===2||e.card===2?'あいこ！ 黒鋼鎧：使用者0ダメージ、相手20ダメージ':'あいこ！ 両者10ダメージ');}else{const player=outcome===1,att=player?p:e,def=player?e:p,hi=player?ph:eh;let n=dmg[att.card][hi],fixed=false;const predatorActive=att.card===3&&def.hp>0&&def.hp<=hp[def.card]/2;if(att.card===0){if(hi===1&&att.lastHand===1){n=35;fixed=true;notes.push('角払い連続使用：35ダメージ完全固定');}if(!fixed){if(hi!==2&&att.boost){n=Math.floor(n*1.5);att.boost=false;notes.push('トルネード強化1.5倍！');}if(att.hp<=36){n=Math.floor(n*1.8);notes.push('底力発動！ 1.8倍');}}if(hi===0&&Math.random()<.1){def.seal=Math.max(def.seal,1);notes.push('必殺技を次の1ターン封印！');}if(hi===2){att.boost=true;notes.push('次の通常攻撃に1.5倍強化！');}}
 if(att.card===2&&hi!==2){n+=att.steel+att.attackBonus;notes.push('黒鋼鎧＋'+att.steel+' / 技強化＋'+att.attackBonus);att.attackBonus=0;}if(att.card===9)n+=Math.floor((hp[9]-att.hp)/40)*20;if(att.card===8&&att.streak===1)n*=2;if(att.card===8&&hi===2&&att.streak===1)n=300;if(att.card===9&&hi===1&&Math.random()<.5)n+=50;if(att.card===3){if(hi===1){const old=def.hp;n=old<=hp[def.card]/2?old:Math.floor(old/2);notes.push(old<=hp[def.card]/2?'🦗 マンティスブレード：即気絶！':'🦗 マンティスブレード：現在HPを半分に！');}else{if(predatorActive){n=Math.floor(n*1.5);notes.push('🧬 捕食者：攻撃1.5倍！');}if(hi===2)notes.push('🦗 ハンティングステップ：'+n/3+'ダメージ×3回');}}if(att.card===1){if(hi===0){if(def.poison>0){n=def.hp;notes.push('☠️ ヴェノムエンド成功！ 毒状態の相手を即気絶');}else notes.push('ヴェノムエンド失敗（相手は毒状態ではない）');}if(hi===2){if(def.poison>0){const old=att.hp;att.hp=Math.min(hp[1],att.hp+120);notes.push('💚 ポイズンヒール：'+(att.hp-old)+'HP回復（最大150）');}else{def.poison+=2;notes.push('ポイズンヒール：相手に毒2ターン追加');}}}if(att.card===5){if(att.lionBonus&&hi!==2){n+=att.lionBonus;notes.push('⚔️ キングスクラッチ強化＋'+att.lionBonus);att.lionBonus=0;}if(hi===1){att.lionBonus+=30;notes.push('⚔️ 次の成功攻撃＋30');}if(hi===2){att.roar=2;notes.push('👑 次ターン技が必ず成功！');}}if(att.card===7&&hi===1)att.hp=Math.min(att.hp,10);if(att.card===9&&hi===0)att.howl+=30;if(att.card===9&&hi===1){n+=att.howl;att.howl=0;}if(att.card===1&&hi===1){def.poison+=3;notes.push('毒針：相手に毒3ターン追加');}if(att.card===2){if(hi===0){att.attackBonus+=10;notes.push('パワーバイト：次の攻撃＋10');}if(hi===1){att.attackBonus+=20;notes.push('アゴばさみ：次の攻撃＋20');}if(hi===2){att.counter=true;notes.push('🛡️ アントガード：反射待機');}}if(att.card===4&&hi===2){def.catLock=3;notes.push('🐾 甘える：相手は3ターン連続で同じ手を出せない！');}const multi=(att.card===3&&hi===2)||(att.card===4&&hi===1),specialEffect=att.card===3&&hi===1;
const hits=att.card===4&&hi===1?[20,20]:multi?[n/3,n/3,n/3]:[n];let dealt=0;
for(let hit=0;hit<hits.length;hit++){
 if(def.hp<=0||att.hp<=0)break;
 const actualDamage=Math.min(Math.max(0,def.hp),Math.max(0,hits[hit]));
 def.hp-=actualDamage;dealt+=actualDamage;
 if(multi)notes.push('🦗 '+(hit+1)+'発目：'+actualDamage+'ダメージ');
 if(att.card===4&&hi===1&&actualDamage>0){const heal=Math.min(hp[4]-att.hp,Math.floor(actualDamage/2));att.hp+=heal;notes.push('🐈 ネコひっかき '+(hit+1)+'発目：実ダメージ'+actualDamage+' / '+heal+'HP回復');}if(att.card===4&&hi===0&&actualDamage>0){const heal=Math.min(hp[4]-att.hp,30);att.hp+=heal;notes.push('🐈 キャットインパクト：'+heal+'HP回復');}if(predatorActive&&!specialEffect){const heal=Math.min(hp[3]-att.hp,Math.floor(actualDamage*.3));if(heal>0){att.hp+=heal;notes.push('💚 捕食者：'+heal+'HP回復'+(multi?'（'+(hit+1)+'発目）':''));}}
 if(!specialEffect&&def.card===2&&def.counter&&actualDamage>0){const reflected=Math.floor(actualDamage/2)+def.steel+def.attackBonus;att.hp-=reflected;notes.push('🛡️ アントガード反射：'+reflected+'ダメージ（技強化＋'+def.attackBonus+'消費）');def.attackBonus=0;def.counter=false;}
}
if(att.card===5&&hi===0){att.hp=Math.max(0,att.hp-50);notes.push('🦁 プライドクラッシュ反動：自分に50ダメージ');}n=dealt;att.streak++;def.streak=0;notes.push((player?'YOU':'CPU')+' '+moves[att.card][hi]+'：'+(att.card===3&&hi===1?n+'HP減少（特殊効果）':n+'ダメージ'));}
 p.lastHand=ph;e.lastHand=eh;for(const f of [p,e])if(f.roar>0)f.roar--;for(const [idx,[f,old]] of [[p,oldSeal[0]],[e,oldSeal[1]]].entries()){if(oldLock[idx]>0)f.catLock=Math.max(0,f.catLock-1);if(old>0)f.seal=Math.max(0,f.seal-1);if(f.poison>0&&f.hp>0){f.hp-=20;f.poison--;notes.push(names[f.card]+'：毒20ダメージ（残り'+f.poison+'ターン）');}if(f.card===4&&f.hp>0){const heal=Math.min(10,hp[4]-f.hp);f.hp+=heal;notes.push('🐈 ゴロゴロ回復：'+heal+'HP回復');}f.hp=Math.max(0,f.hp);}rollLionAura(p,e);notes.forEach(arcLog);a.turn++;arcRender();if(a.debug){if(p.hp===0||e.hp===0)$('debugNotice').textContent='対戦終了。再戦するには「対戦を開始・リセット」を押してください。';return;}if(p.hp===0||e.hp===0){$('arcMoves').replaceChildren();$('nextPanel').classList.remove('hidden');if(p.hp>0){$('nextTitle').textContent=a.stage===5?'🏆 ALL CLEAR！':'✨ STAGE CLEAR！';if(a.stage===5){$('nextDesc').textContent='5連勝達成！';$('nextButton').textContent='もう一度挑戦';$('nextButton').onclick=startArcade;}else{const old=p.hp;p.hp=Math.min(hp[p.card],p.hp+Math.ceil(hp[p.card]*.3));$('nextDesc').textContent='HP '+old+' → '+p.hp+'（30%回復）';$('nextButton').textContent='次のステージへ';$('nextButton').onclick=()=>{a.stage++;startStage();};}}else{$('nextTitle').textContent='💀 GAME OVER';$('nextDesc').textContent='ステージ'+a.stage+'で敗北！';$('nextButton').textContent='最初から再挑戦';$('nextButton').onclick=startArcade;}}}

let debugHands=[0,0];
function openDebug(){if(!$('debugLeft').options.length){names.forEach((n,i)=>{for(const id of ['debugLeft','debugRight'])$(id).add(new Option(icons[i]+' '+n,i));});$('debugLeft').value='3';$('debugRight').value='2';}show('debug');}
function startDebug(){const l=+$('debugLeft').value,r=+$('debugRight').value;arc={debug:true,player:fighter(l,hp[l]),enemy:fighter(r,hp[r]),turn:1};if(l===1)arc.enemy.poison+=5;if(r===1)arc.player.poison+=5;rollLionAura(arc.player,arc.enemy);debugHands=[0,0];$('debugLog').replaceChildren();$('debugNotice').textContent='左右の技を選んで実行してください。';$('debugBattle').classList.remove('hidden');debugRender();}
function setDebugHp(){if(!arc?.debug)return;for(const [f,id] of [[arc.player,'debugLeftHp'],[arc.enemy,'debugRightHp']]){const val=Number($(id).value);if(Number.isFinite(val))f.hp=Math.max(0,Math.min(hp[f.card],Math.floor(val)));}debugRender();}
function debugRender(){if(!arc?.debug)return;const a=arc;$('debugStage').textContent='DEBUG BATTLE · TURN '+a.turn;for(const [f,other,prefix,input] of [[a.player,a.enemy,'debugA','debugLeftHp'],[a.enemy,a.player,'debugE','debugRightHp']]){$(prefix+'pic').textContent=icons[f.card];$(prefix+'name').textContent=names[f.card];$(prefix+'hp').textContent=f.hp+'/'+hp[f.card];$(prefix+'bar').style.width=100*f.hp/hp[f.card]+'%';$(prefix+'status').textContent=status(f,other);$(input).value=f.hp;$(input).max=hp[f.card];}for(const [side,f,id] of [[0,a.player,'debugLeftMoves'],[1,a.enemy,'debugRightMoves']]){$(id).replaceChildren();moves[f.card].forEach((name,i)=>{const b=document.createElement('button');b.className='rps-move hand-'+['rock','scissors','paper'][i]+(i===special[f.card]?' is-special':'')+(debugHands[side]===i?' selected':'');b.textContent=hand[i]+' '+name+' ('+dmg[f.card][i]+')';if(i===special[f.card]){const tag=document.createElement('strong');tag.className='special-tag';tag.textContent='★ 必殺技';b.append(tag);}b.disabled=(f.seal>0&&special[f.card]===i)||(f.catLock>0&&i===f.lastHand)||(f.palmBlocked&&i===2)||(f.card===5&&i===2&&f.lastHand===2);b.onclick=()=>{debugHands[side]=i;debugRender();};$(id).append(b);});}}
function debugPlay(){if(!arc?.debug)return;if(arc.player.hp<=0||arc.enemy.hp<=0){$('debugNotice').textContent='対戦終了です。リセットしてください。';return;}if((arc.player.seal>0&&debugHands[0]===special[arc.player.card])||(arc.enemy.seal>0&&debugHands[1]===special[arc.enemy.card])||(arc.player.catLock>0&&debugHands[0]===arc.player.lastHand)||(arc.enemy.catLock>0&&debugHands[1]===arc.enemy.lastHand)||(arc.player.palmBlocked&&debugHands[0]===2)||(arc.enemy.palmBlocked&&debugHands[1]===2)||(arc.player.card===5&&debugHands[0]===2&&arc.player.lastHand===2)||(arc.enemy.card===5&&debugHands[1]===2&&arc.enemy.lastHand===2)){$('debugNotice').textContent='封印・甘える・キングズロア連続使用禁止の手は選べません。';return;}arcPlay(debugHands[0],debugHands[1]);}

setupCards();const code=new URLSearchParams(location.search).get('room');if(code&&/^\d{6}$/.test(code)){$('roomInput').value=code;show('online');}
